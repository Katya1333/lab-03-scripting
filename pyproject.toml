[project]
name = "ghevents"
version = "0.1.0"
description = "Parse GH events"
readme = "README.md"
authors = [
    { name = "Katya1333", email = "katyapribram@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
ghevents = "ghevents:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
